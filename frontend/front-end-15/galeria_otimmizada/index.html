<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria Responsiva</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles.min.css">
</head>
<body>
  <header class="cabecalho">
    <h1>Galeria de Projetos</h1>
    <p>Trabalhos desenvolvidos pela turma.</p>
  </header>
 
  <main class="galeria">
    <figure class="cartao">
      <img src="imagem1.jpg"
           alt="Mostra Mega Man X apontando seu canhão de braço para frente ao lado de Zero, que segura seu sabre de luz azul, em um cenário digital abstrato."
           width="800" height="500" loading="lazy">
      <figcaption>Projeto 1</figcaption>
    </figure>
 
    <figure class="cartao">
      <img src="imagem2.jpg"
           alt="Apresenta uma arte estilizada em tons de vermelho e branco do personagem Zero em movimento dinâmico de combate, com efeitos de velocidade."
           width="800" height="500" loading="lazy">
      <figcaption>Projeto 2</figcaption>
    </figure>
 
    <figure class="cartao">
      <img src="imagem3.jpg"
           alt="Exibe uma ilustração detalhada em estilo anime com Zero em primeiro plano olhando para o espectador, cercado por robôs e mechas ao fundo."
           width="800" height="500" loading="lazy">
      <figcaption>Projeto 3</figcaption>
    </figure>
  </main>
</body>
</html>
